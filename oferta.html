<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oferta Mięs - Mięsny Zakątek</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="subpage">
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="logo" style="text-decoration:none; color:white;">MIĘSNY ZAKĄTEK</a>
            <a href="index.html" class="mcd-btn" style="padding: 10px 20px;">POWRÓT</a>
        </div>
    </nav>

    <section class="mcd-section gray" style="margin-top:80px;">
        <div class="mcd-container">
            <h2 class="center-title">Galeria Zdjęć</h2>
            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="boczek.jpg" alt="Boczek">
                    <div class="card-text">
                        <h3>Boczek Tradycyjny</h3>
                        <p>Wędzony naturalnie, bez chemii.</p>
                    </div>
                </div>
                <div class="gallery-card">
                    <img src="karczek.jpg" alt="Karczek">
                    <div class="card-text">
                        <h3>Karczek Premium</h3>
                        <p>Soczysty i kruchy, idealny na obiad.</p>
                    </div>
                </div>
                <div class="gallery-card">
                    <img src="lopatka.jpg" alt="Łopatka">
                    <div class="card-text">
                        <h3>Świeża Łopatka</h3>
                        <p>Codzienna dostawa od polskich rolnikow.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
